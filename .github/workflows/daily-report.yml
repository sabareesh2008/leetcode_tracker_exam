name: Daily ECE Performance Report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: read

concurrency:
  group: ece-daily-email-report
  cancel-in-progress: false

jobs:
  send-daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install report dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and send daily report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_FROM_EMAIL: ${{ secrets.REPORT_FROM_EMAIL }}
          REPORT_TO_EMAILS: ${{ secrets.REPORT_TO_EMAILS }}
          REPORT_REPLY_TO: ${{ secrets.REPORT_REPLY_TO }}
        run: python report_generator.py --mode daily

      - name: Upload generated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-email-report
          path: reports/latest_daily_report.html
          if-no-files-found: ignore
          retention-days: 7
